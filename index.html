  .hd-card { border: 1px solid var(--line); background: #FFFDF8; padding: 16px 18px; }
  .hd-card .k { font-size: 12px; letter-spacing: .16em; color: var(--muted); display: flex; align-items: center; }
  .hd-card .v { font-family: var(--serif); font-size: 22px; font-weight: 600; margin: 4px 0 8px; }
  .hd-card .v small { color: var(--muted); font-weight: 400; }
  .hd-card .t { font-size: 14.5px; line-height: 1.8; color: var(--ink-2); }
  .hd-card .ln { display: inline-block; font-size: 12px; color: var(--gold); border: 1px solid var(--gold-soft); border-radius: 999px; padding: 0 7px; margin-right: 6px; }
  @media (max-width: 640px) { .hd-cards { grid-template-columns: 1fr; } }
  .hd-centers { display: grid; grid-template-columns: repeat(2, 1fr); column-gap: 28px; }
  @media (max-width: 640px) { .hd-centers { grid-template-columns: 1fr; } }
  @media print { .qm { display: none; } }
  .list-plain li.pl { display: grid; grid-template-columns: 40px 1fr; gap: 14px; padding: 14px 0; align-items: start; }
  .pl-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; color: #fff; background: var(--pc); box-shadow: 0 2px 8px color-mix(in srgb, var(--pc) 35%, transparent); font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols", serif; }
  .pl-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin-bottom: 4px; }
  .pl-head b { margin-right: 4px; }
  .pl-head .pl-kw { margin-left: 2px; }
  .pl-head b { font-family: var(--serif); font-size: 17px; color: var(--pc); }
  .pl-kw { font-size: 12.5px; color: var(--muted); letter-spacing: .08em; }
  .pl-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 6px; }
  .chip { font-size: 12px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink-2); white-space: nowrap; }
  .chip.sign { border-color: color-mix(in srgb, var(--pc) 45%, var(--line)); color: var(--ink); }
  .chip.retro { background: #F3E6E1; border-color: #E5CBC2; color: var(--red); }
  .pl .sub { margin: 0; }
  .pl-icon.outline { background: var(--paper); color: var(--pc); border: 1.5px dashed var(--pc); box-shadow: none; }
  .chip.on { background: #F1E6D2; border-color: var(--gold-soft); color: #7A5C30; }
  .chip.off { border-style: dashed; color: var(--muted); }
  .hd-centers li.pl { grid-template-columns: 34px 1fr; gap: 12px; }
  .hd-centers .pl-icon { width: 32px; height: 32px; font-size: 14px; }
  .portrait .plines b { display: inline-flex; align-items: center; }
  .portrait .plines b::before { content: none; }
  .li-ic { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; margin-right: 8px; border-radius: 50%; background: var(--pc); color: #fff; font-size: 13px; font-family: "Apple Symbols", "Segoe UI Symbol", serif; flex: none; }
  .ev span .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pc); margin-right: 6px; vertical-align: 1px; }
  .ev span[style] { background: color-mix(in srgb, var(--pc) 10%, var(--paper)); }
  .nav-ic { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; margin-right: 7px; border-radius: 50%; background: var(--pc); color: #fff; font-size: 11px; letter-spacing: 0; vertical-align: 1px; font-family: "Apple Symbols", "Segoe UI Symbol", serif; }
  .overview a { border-top: 3px solid transparent; transition: border-color .2s, background .2s; }
  .overview a:hover { border-top-color: var(--pc); }
  .overview .sys { color: var(--pc); }
  .pl-retro { margin: 6px 0 0; font-size: 13.5px; color: var(--red); padding-left: 10px; border-left: 2px solid #E5CBC2; }
  details.fold { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 30px 0 0; }
  details.fold + details.fold { margin-top: 0; border-top: none; }
  .el-wrap { display: grid; grid-template-columns: 320px 1fr; gap: 28px; align-items: center; }
  .el-wheel svg { width: 100%; max-width: 320px; height: auto; display: block; margin: 0 auto; }
  .el-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .el-legend i { display: inline-block; vertical-align: middle; margin-right: 5px; }
  .el-legend .ln { width: 18px; border-top: 1.6px solid #B9AE9E; }
  .el-legend .ln.dash { border-top: 1.4px dashed #C9BDAA; }
  .el-legend .ring { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #A88550; }
  .el-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .el-row { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: center; }
  .el-ic { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--pc); color: #fff; font-family: var(--serif); font-size: 17px; font-weight: 600; }
  .el-ic.none { background: var(--paper); color: var(--pc); border: 1.5px dashed var(--pc); }
  .el-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  .el-head b { font-family: var(--serif); font-size: 15px; color: var(--pc); }
  .el-head i { font-style: normal; }
  .el-track { height: 8px; border-radius: 4px; background: var(--paper-2); overflow: hidden; }
  .el-fill { height: 100%; border-radius: 4px; background: var(--pc); }
  @media (max-width: 680px) { .el-wrap { grid-template-columns: 1fr; } }
  details.fold summary { cursor: pointer; list-style: none; padding: 14px 0; display: flex; align-items: center; gap: 12px; }
  details.fold .fmain { flex: 1; min-width: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
  details.fold summary::after { flex: none; align-self: center; }
  .f-ic { flex: none; min-width: 30px; font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--pc); letter-spacing: .02em; font-variant-numeric: lining-nums; }
  details.fold[style] .ft { color: var(--ink); }
  details.fold[style][open] { border-bottom-color: var(--pc); }
  details.fold[style] summary:hover .ft { color: var(--pc); }
  .f-tags { display: inline-flex; flex-wrap: wrap; gap: 6px; margin-left: 4px; vertical-align: 1px; }
  .f-tags span { font-size: 12px; color: var(--pc); white-space: nowrap; }
  details.fold summary::-webkit-details-marker { display: none; }
  details.fold summary::after { content: '展開 ＋'; font-size: 12px; letter-spacing: .14em; color: var(--gold); white-space: nowrap; }
  details.fold[open] summary::after { content: '收合 －'; }
  details.fold .ft { font-family: var(--serif); font-size: 18px; font-weight: 600; letter-spacing: .05em; }
  details.fold .fh { font-size: 12.5px; color: var(--muted); }
  details.fold .fold-body { padding: 0 0 18px; }
  details.fold .fold-body > .list-plain:last-child > li:last-child { border-bottom: none; }
  .list-plain li .retro { color: var(--muted); font-size: 13.5px; }

  .disclaimer { font-size: 12px; color: var(--muted); text-align: center; margin-top: 72px; padding-top: 24px; border-top: 1px solid var(--line); line-height: 1.8; }

  @media print { .no-print { display: none !important; } body { background: #fff; } section.system { break-before: page; } }
</style>
</head>
<body>
<div class="wrap">

  <div class="input-area no-print">
    <header class="app-head">
      <div class="eyebrow">免費命盤排盤</div>
      <h1 class="app-title">東西方命盤大亂鬥</h1>
      <p class="app-sub">六種系統一起上場，看看誰最懂你。<br>生命靈數、八字、紫微、星盤、人類圖，輸入一次生日就全部排好，還會幫你整理它們重複提到的地方。</p>
    </header>
    <div class="step-label"><span>1</span>出生資料</div>
    <div class="controls">
      <div><label class="f" for="name">稱呼（選填）</label><input type="text" id="name" placeholder="想怎麼稱呼都可以"></div>
      <div><label class="f" for="birth">生日</label><input type="date" id="birth"></div>
      <div><label class="f" for="time">出生時間</label><input type="time" id="time"></div>
      <div><label class="f" for="place">出生地</label><select id="place"></select></div>
      <div><label class="f" for="gender">性別</label>
        <select id="gender"><option value="F">女</option><option value="M">男</option></select></div>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="unknown"> 不知道出生時間</label>
      <label><input type="checkbox" id="dst"> 出生時是日光節約時間</label>
      <label><input type="checkbox" id="trueSolar"> 八字、紫微用真太陽時</label>
    </div>
    <p class="late-zi">23:00 以後出生（晚子時），八字和紫微斗數都以<b>隔天</b>計算。</p>
    <div class="step-label"><span>2</span>想分析的系統</div>
    <div class="presets" id="presets">
      <button type="button" data-preset="all">全選</button>
      <button type="button" data-preset="east">東方命理</button>
      <button type="button" data-preset="west">西方占星</button>
      <button type="button" data-preset="energy">能量與人類圖</button>
      <button type="button" data-preset="notime">不需出生時間</button>
      <button type="button" data-preset="none">清除</button>
    </div>
    <div class="pick-grid" id="pickGrid"></div>
    <div class="btns">
      <button class="btn" id="go">開始分析</button>
      <button class="btn line" id="print">列印／存成 PDF</button>
      <span class="changed-hint" id="changedHint">資料改了，按「更新分析」看新結果</span>
    </div>
    <p class="hint">所有計算都在你的裝置上完成，生日不會傳到任何地方。</p>
  </div>

  <main id="out"></main>
</div>

<script src="lib/astro.js"></script>
<script src="lib/chinese-calendar.js"></script>
<script src="lib/birth.js"></script>
<script src="engine.js"></script>
<script src="systems/bazi.js"></script>
<script src="systems/ziwei.js"></script>
<script src="systems/astrology.js"></script>
<script src="systems/humandesign.js"></script>
<script src="texts.js"></script>
<script src="texts-systems.js"></script>
<script src="texts-explain.js"></script>
<script src="synthesis.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var T = TEXTS, X = SYS_TEXTS;
  var NUMS = ['一', '二', '三', '四', '五', '六'];

  Birth.PLACES.forEach(function (p) {
    var o = document.createElement('option'); o.value = p.id; o.textContent = p.name; $('place').appendChild(o);
  });

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function sys(no, id, title, lead, body) {
    no = chapterNo++;
    return '<section class="system" id="' + id + '"><div class="sys-head"><div class="no">第' + NUMS[no] + '章</div><h2>' + title + '</h2>' +
      '<p class="lead">' + lead + '</p></div>' + body + '</section>';
  }
  function table(head, rows, nowFlags) {
    var h = '<div class="table-wrap"><table><thead><tr>' + head.map(function (x) { return '<th>' + x + '</th>'; }).join('') + '</tr></thead><tbody>';
    rows.forEach(function (r, i) { h += '<tr' + (nowFlags && nowFlags[i] ? ' class="now"' : '') + '>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; });
    return h + '</tbody></table></div>';
  }
  function bars(items, max) {
    return '<div class="bars">' + items.map(function (it) {
      var w = max ? Math.round(it.value / max * 100) : 0;
      return '<div class="bar-row"><div class="serif">' + it.label + '</div><div class="bar-track"><div class="bar-fill" style="width:' + w + '%;' + (it.color ? 'background:' + it.color : '') + '"></div></div><div class="bar-note">' + it.note + '</div></div>';
    }).join('') + '</div>';
  }

  function chakraColumn(chakras, max, colorOf, noteOf) {
    return '<div class="chakra-col">' + chakras.slice().reverse().map(function (c) {
      var col = colorOf(c.id), w = c.count ? Math.round(c.count / max * 100) : 0, size = c.count ? Math.min(30, 18 + c.count * 4) : 18;
      return '<div class="ck-row"><span class="ck-orb' + (c.count ? '' : ' off') + '" style="--c:' + col + ';--g:' + (c.count ? 4 + c.count * 5 : 0) + 'px;width:' + size + 'px;height:' + size + 'px"></span>' +
        '<div class="ck-name">' + c.name + '<small>' + (c.count ? '出現 ' + c.count + ' 次' : '還沒出現') + '</small></div>' +
        '<div class="ck-track"><div class="ck-fill" style="width:' + w + '%;background:' + col + '"></div></div>' +
        '<div class="ck-note">' + noteOf(c) + '</div></div>';
    }).join('') + '</div>';
  }

  // ===== 選擇要分析的系統 =====
  var SYSTEMS = [
    { id: 'numerology', name: '生命靈數 × 脈輪', key: '生命靈數', note: '只要生日' },
    { id: 'bazi', name: '八字', key: '八字', note: '時辰可不填' },
    { id: 'ziwei', name: '紫微斗數', key: '紫微斗數', note: '需要出生時間' },
    { id: 'western', name: '西洋占星', key: '西洋占星', note: '上升需要時間' },
    { id: 'vedic', name: '印度占星', key: '印度占星', note: 'Lagna 需要時間' },
    { id: 'hd', name: '人類圖', key: '人類圖', note: '需要出生時間' }
  ];
  var PRESETS = { all: ['numerology', 'bazi', 'ziwei', 'western', 'vedic', 'hd'], east: ['bazi', 'ziwei'], west: ['western', 'vedic'],
    energy: ['numerology', 'hd'], notime: ['numerology', 'bazi', 'western', 'vedic'], none: [] };
  function getPicked() { return SYSTEMS.filter(function (x) { var el = $('pk-' + x.id); return el && el.checked; }).map(function (x) { return x.id; }); }
  function syncPick() {
    var picked = getPicked();
    SYSTEMS.forEach(function (x) { $('pk-' + x.id).parentNode.classList.toggle('on', picked.indexOf(x.id) !== -1); });
    Object.keys(PRESETS).forEach(function (k) {
      var b = document.querySelector('#presets [data-preset="' + k + '"]');
      b.classList.toggle('on', k !== 'none' && PRESETS[k].length === picked.length && PRESETS[k].every(function (i) { return picked.indexOf(i) !== -1; }));
    });
    try { localStorage.setItem('picked-systems', JSON.stringify(picked)); } catch (e) {}
  }
  function buildPicker() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem('picked-systems')); } catch (e) {}
    if (!Array.isArray(saved) || !saved.length) saved = PRESETS.all;
    $('pickGrid').innerHTML = SYSTEMS.map(function (x) {
      var st = SYS_STYLE[x.key];
      return '<label class="pk" style="--pc:' + st[1] + '"><input type="checkbox" id="pk-' + x.id + '"' + (saved.indexOf(x.id) !== -1 ? ' checked' : '') + '>' +
        '<span class="pk-ic">' + st[0] + '︎</span><span class="pk-name">' + x.name + '<span class="pk-note">' + x.note + '</span></span><span class="pk-check"></span></label>';
    }).join('');
    $('pickGrid').addEventListener('change', function () { syncPick(); markChanged(); });
    $('presets').addEventListener('click', function (e) {
      var k = e.target.getAttribute && e.target.getAttribute('data-preset'); if (!k) return;
      SYSTEMS.forEach(function (x) { $('pk-' + x.id).checked = PRESETS[k].indexOf(x.id) !== -1; });
      syncPick(); markChanged();
    });
    syncPick();
  }

  var chapterNo = 0, LAST = null;
  function run() {
    var parts = ($('birth').value || '').split('-').map(Number);
    if (parts.length !== 3 || !parts[0]) { $('out').innerHTML = ''; return; }
    var tm = ($('time').value || '12:00').split(':').map(Number);
    var unknown = $('unknown').checked || !$('time').value; // 沒填時間就當作不知道
    var birth = Birth.create({
      y: parts[0], m: parts[1], d: parts[2], hour: tm[0], minute: tm[1] || 0, timeKnown: !unknown,
      placeId: $('place').value, dst: $('dst').checked, gender: $('gender').value, trueSolar: $('trueSolar').checked
    });
    var now = new Date(), nowYear = now.getFullYear();
    var nowJd = Astro.julianDay(nowYear, now.getMonth() + 1, now.getDate(), 12);
    var name = $('name').value.trim();

    var nu = NumerologyEngine.calculate(birth.y, birth.m, birth.d, { method: 'A', year: nowYear });
    var bz = Bazi.calculate(birth, { year: nowYear });
    var zw = Ziwei.calculate(birth);
    var we = Astrology.western(birth);
    var ve = Astrology.vedic(birth, nowJd);
    var hd = HumanDesign.calculate(birth);

    var picked = getPicked();
    if (!picked.length) { $('out').innerHTML = '<p class="notice" style="margin-top:40px">請至少勾選一個想分析的系統。</p>'; return; }
    var has = function (id) { return picked.indexOf(id) !== -1; };
    chapterNo = 0;
    LAST = { birth: birth, name: name, nowYear: nowYear, picked: picked };

    var html = '';
    // 封面
    html += '<header class="cover"><div class="eyebrow">一個生日，六種看見自己的方式</div>' +
      '<h1>' + (name ? esc(name) + ' 的' : '') + (picked.length === 6 ? '綜合命盤' : SYSTEMS.filter(function (x) { return has(x.id); }).map(function (x) { return x.key; }).join('・')) + '</h1>' +
      '<div class="meta">' + birth.y + '.' + pad(birth.m) + '.' + pad(birth.d) + (birth.timeKnown ? '　' + pad(birth.hour) + ':' + pad(birth.minute) : '　時間不確定') +
      '　' + birth.place.name + '<br>農曆 ' + (bz.lunar ? bz.lunar.text : '') + '　生肖' + bz.zodiac + '</div></header>';
    html += '<nav class="secnav no-print" id="secnav" aria-label="章節導覽"></nav>';

    var only = SYSTEMS.filter(function (x) { return has(x.id); }).map(function (x) { return x.key; });
    if (picked.length >= 2) {
      var syn = Synthesis.build({ nu: nu, bz: bz, zw: zw, we: we, ve: ve, hd: hd },
        { T: T, X: X, E: EXPLAIN, nowYear: nowYear, birthYear: birth.y, only: only, centerName: function (c) { return HumanDesign.CENTERS[c].name; } });
      html += synthesisSection(syn, name ? esc(name) : '', picked.length);
    }
    html += midCta();

    // 各系統一眼看
    html += '<h3 style="margin-top:48px">' + (picked.length === 6 ? '六個系統' : '各系統') + '一眼看</h3>';
    var weTop = we.planets[0].sign.replace('座', '') + '太陽・' + we.planets[1].sign.replace('座', '') + '月亮';
    html += '<nav class="overview">' +
      cell('numerology', '生命靈數 × 脈輪', T.types[nu.energyType].name, '天賦脈輪：' + nu.lifePathChakras.map(function (id) { return T.chakras[id].name; }).join('＋') + '・生命靈數 ' + nu.lifePath) +
      cell('bazi', '八字', bz.dayMaster.stem + bz.dayMaster.element + '日主', bz.pillars.map(function (p) { return p.unknown ? '??' : p.ganzhi; }).join(' ')) +
      cell('ziwei', '紫微斗數', zw.unknownTime ? '需要出生時間' : zw.mingMainStars.join('、') + (zw.mingBorrowed ? '（借對宮）' : ''), zw.unknownTime ? '' : '命宮在' + zw.mingBranch + '・' + zw.juName) +
      cell('western', '西洋占星', weTop, we.asc ? '上升' + we.asc.sign : '上升需要出生時間') +
      cell('vedic', '印度占星', ve.moonNakshatra.name, '月亮星宿・' + ve.moonNakshatra.zh + (ve.lagna ? '・Lagna ' + ve.lagna.rashi.split(' ')[1] : '')) +
      cell('hd', '人類圖', hd.unknownTime ? '需要出生時間' : X.hd.types[hd.type].name, hd.unknownTime ? '' : hd.profile + ' 人生角色・' + X.hd.authorities[hd.authority].name) +
      '</nav>';
    if (!birth.timeKnown) html += '<p class="notice">沒有出生時間時：八字少了時柱，紫微斗數、上升星座、宮位和人類圖無法計算，月亮的位置也可能有誤差。</p>';

    if (has('numerology')) html += numerologySection(nu);
    if (has('bazi')) html += baziSection(bz, nowYear);
    if (has('ziwei')) html += ziweiSection(zw, birth, nowYear);
    if (has('western')) html += westernSection(we, birth);
    if (has('vedic')) html += vedicSection(ve, we);
    if (has('hd')) html += hdSection(hd);
    html += aiPackSection();

    html += '<p class="disclaimer">這份分析以多種命理與占星系統為工具，提供自我覺察的參考，不是醫療、心理治療或任何形式的保證。<br>' +
      '所有排盤都由這個工具自行計算（天文公式與傳統排盤規則），已用實際命盤與已知天象驗證；重要的決定，建議再用專業軟體對照。</p>';
    $('out').innerHTML = html;
    buildSecNav();
    updateAiText();
    renderUnlock();
  }

  // ===== 章節導覽列：固定在上方，可左右滑，捲動時自動標示目前章節 =====
  var NAV_ITEMS = [

      return irow(['⟷', '#2B2622'], info[0] + '的通道', c.gates.join('–'), [[c.centers.join(' ↔ '), 'sign']], info[1] + '。');
    }).join('') + '</ul>' : '<p class="prose">沒有完整接通的通道。</p>');

    b += fold('閘門啟動' + q('閘門'), '26 個閘門的詳細位置', '<div class="howto">' + H.gatesHow + '</div>' + table(['天體', '個性（黑）', '設計（紅）'], r.personality.map(function (p, i) {
      return ['<span class="serif">' + p.name + '</span>', p.gate + '.' + p.line, '<span style="color:var(--red)">' + r.design[i].gate + '.' + r.design[i].line + '</span>'];
    })));
    b += '<p class="note">設計時間約為 ' + r.designDate + '（太陽往回 88°）。' + X.hd.note + '</p>';
    return sys(5, 'hd', '人類圖', X.intro.hd, b);
  }

  function bodygraph(r) {
    var C = {
      head:   { pts: [[210, 12], [256, 80], [164, 80]], label: [150, 52, 'end'], name: '頭頂' },
      ajna:   { pts: [[164, 102], [256, 102], [210, 170]], label: [150, 128, 'end'], name: '邏輯' },
      throat: { pts: [[172, 194], [248, 194], [248, 270], [172, 270]], name: '喉嚨' },
      g:      { pts: [[210, 288], [258, 336], [210, 384], [162, 336]], name: 'G' },
      heart:  { pts: [[262, 400], [328, 400], [306, 342]], label: [342, 372, 'start'], name: '意志力' },
      sacral: { pts: [[170, 418], [250, 418], [250, 498], [170, 498]], name: '薦骨' },
      spleen: { pts: [[28, 398], [28, 484], [106, 441]], label: [44, 506, 'middle'], name: '直覺' },
      solar:  { pts: [[392, 398], [392, 484], [314, 441]], label: [376, 506, 'middle'], name: '情緒' },
      root:   { pts: [[172, 530], [248, 530], [248, 602], [172, 602]], name: '根部' }
    };
    var G = { // 每個閘門固定一個位置
      64: [190, 72], 61: [210, 72], 63: [230, 72],
      47: [190, 110], 24: [210, 110], 4: [230, 110], 17: [194, 130], 11: [226, 130], 43: [210, 152],
      62: [192, 202], 23: [210, 202], 56: [228, 202], 16: [180, 222], 20: [180, 252], 35: [240, 212], 12: [240, 232], 45: [240, 252],
      31: [194, 262], 8: [210, 262], 33: [226, 262],
      7: [198, 306], 1: [210, 298], 13: [222, 306], 10: [172, 336], 25: [248, 336], 15: [198, 366], 2: [210, 374], 46: [222, 366],
      21: [304, 358], 51: [276, 392], 26: [294, 392], 40: [314, 392],
      5: [192, 426], 14: [210, 426], 29: [228, 426], 34: [178, 440], 27: [178, 474], 59: [242, 458], 42: [192, 490], 3: [210, 490], 9: [228, 490],
      48: [42, 414], 57: [60, 423], 44: [78, 432], 50: [92, 441], 32: [74, 452], 28: [56, 462], 18: [40, 472],
      36: [378, 414], 22: [360, 423], 37: [342, 432], 6: [328, 441], 49: [346, 452], 55: [364, 462], 30: [380, 472],
      53: [192, 538], 60: [210, 538], 52: [228, 538], 54: [180, 556], 38: [180, 574], 58: [180, 592], 19: [240, 556], 39: [240, 574], 41: [240, 592]
    };
    var ROUTE = { '20-34': [146, 346] }; // 繞過 G 中心
    var INK = '#2B2622', RED = '#A85A4A', PIPE = '#E6DDCF';
    var defined = {}; r.definedCenters.forEach(function (c) { defined[c] = true; });
    function color(g) { var v = r.gates[g]; return !v ? null : v.indexOf('P') !== -1 ? INK : RED; }
    function path(a, b, q) { return 'M' + a[0] + ',' + a[1] + (q ? ' Q' + q[0] + ',' + q[1] + ' ' : ' L') + b[0] + ',' + b[1]; }
    var base = '', active = '';
    HumanDesign.CHANNELS.forEach(function (ch) {
      var a = G[ch[0]], b = G[ch[1]], q = ROUTE[ch[0] + '-' + ch[1]];
      base += '<path d="' + path(a, b, q) + '" fill="none" stroke="' + PIPE + '" stroke-width="7" stroke-linecap="round"/>';
      var mid = q ? [(a[0] + 2 * q[0] + b[0]) / 4, (a[1] + 2 * q[1] + b[1]) / 4] : [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      var qa = q ? [(a[0] + q[0]) / 2, (a[1] + q[1]) / 2] : null, qb = q ? [(b[0] + q[0]) / 2, (b[1] + q[1]) / 2] : null;
      var ca = color(ch[0]), cb = color(ch[1]), both = ca && cb;
      var w = both ? 5 : 3.5, op = both ? '' : ' stroke-opacity=".5"';
      if (ca) active += '<path d="' + path(a, mid, qa) + '" fill="none" stroke="' + ca + '" stroke-width="' + w + '"' + op + '/>';
      if (cb) active += '<path d="' + path(b, mid, qb) + '" fill="none" stroke="' + cb + '" stroke-width="' + w + '"' + op + '/>';
    });
    var shapes = '', labels = '', dots = '';
    Object.keys(C).forEach(function (c) {
      var on = defined[c], pts = C[c].pts, x = 0, y = 0;
      pts.forEach(function (p) { x += p[0]; y += p[1]; }); x /= pts.length; y /= pts.length;
      shapes += '<polygon points="' + pts.map(function (p) { return p.join(','); }).join(' ') + '" fill="' + (on ? '#CDB78F' : '#FFFDF8') + '" stroke="' + (on ? '#8A6A3A' : '#B9AE9E') + '" stroke-width="' + (on ? 2 : 1.5) + '"' + (on ? '' : ' stroke-dasharray="4 3"') + '/>';
      var L = C[c].label, fill = on ? INK : '#8A8076';
      labels += L ? '<text x="' + L[0] + '" y="' + L[1] + '" text-anchor="' + L[2] + '" font-size="13" font-weight="600" fill="' + fill + '">' + C[c].name + '</text>'
        : '<text x="' + x + '" y="' + (y + 5) + '" text-anchor="middle" font-size="14" font-weight="600" fill="' + fill + '">' + C[c].name + '</text>';
    });
    Object.keys(G).forEach(function (g) {
      var p = G[g], v = r.gates[g], col = color(g);
      dots += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="7.5" fill="' + (col || '#FFFDF8') + '" stroke="' + (v && v.length > 1 ? RED : col || '#B9AE9E') + '" stroke-width="' + (v && v.length > 1 ? 2.2 : 1) + '"/>' +
        '<text x="' + p[0] + '" y="' + (p[1] + 3) + '" text-anchor="middle" font-size="8" font-weight="600" fill="' + (col ? '#fff' : '#8A8076') + '">' + g + '</text>';
    });
    var legend = '<g font-size="10.5" fill="#4A433D">' +
      '<rect x="14" y="624" width="14" height="10" fill="#CDB78F" stroke="#8A6A3A"/><text x="33" y="633">有定義</text>' +
      '<rect x="80" y="624" width="14" height="10" fill="#FFFDF8" stroke="#B9AE9E" stroke-dasharray="3 2"/><text x="99" y="633">開放</text>' +
      '<line x1="140" y1="629" x2="162" y2="629" stroke="' + INK + '" stroke-width="5"/><text x="167" y="633">接通的通道</text>' +
      '<circle cx="246" cy="629" r="6" fill="' + INK + '"/><text x="256" y="633">個性（黑）</text>' +
      '<circle cx="324" cy="629" r="6" fill="' + RED + '"/><text x="334" y="633">設計（紅）</text></g>';
    return '<svg viewBox="0 0 420 644" xmlns="http://www.w3.org/2000/svg" font-family="inherit">' + base + shapes + active + dots + labels + legend + '</svg>';
  }

  // 小問號：點一下看名詞解釋
  var tip = document.createElement('div'); tip.id = 'tip'; document.body.appendChild(tip);
  var tipFor = null;
  function hideTip() { tip.classList.remove('show'); if (tipFor) tipFor.classList.remove('on'); tipFor = null; }
  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('.qm');
    if (!btn) { if (!tip.contains(e.target)) hideTip(); return; }
    e.preventDefault(); e.stopPropagation();
    if (tipFor === btn) { hideTip(); return; }
    hideTip();
    var term = btn.getAttribute('data-term');
    tip.innerHTML = '<b>' + term + '</b>' + EXPLAIN.glossary[term];
    tip.classList.add('show'); btn.classList.add('on'); tipFor = btn;
    var r = btn.getBoundingClientRect(), w = Math.min(300, document.documentElement.clientWidth - 24);
    tip.style.maxWidth = w + 'px';
    var left = Math.max(12, Math.min(r.left + window.scrollX - 20, window.scrollX + document.documentElement.clientWidth - tip.offsetWidth - 12));
    tip.style.left = left + 'px'; tip.style.top = (r.bottom + window.scrollY + 8) + 'px';
  }, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideTip(); });
  window.addEventListener('resize', hideTip);

  // 開始分析：載入動畫 → 算 → 捲到結果 → 逐段浮現
  var CHAKRA_COLORS = ['#B0594C', '#C3824F', '#BF9A45', '#6C8F74', '#5D88A6', '#6B6AA0', '#90719C'];
  var STEPS = ['計算生命靈數與脈輪', '排八字四柱', '安紫微斗數命盤', '計算西洋星盤', '換算印度恆星黃道', '畫人類圖', '整理六個系統的共同點'];
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var busy = false;
  function toast(msg) {
    var t = document.querySelector('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.timer); toast.timer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function revealAll() {
    var els = document.querySelectorAll('#out .cover, #out .portrait, #out section.system, #out nav.overview');
    if (reduce || !('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -8% 0px' });
    els.forEach(function (el) { el.classList.add('reveal'); io.observe(el); });
  }
  function analyze() {
    if (busy) return;
    if (!$('birth').value) { toast('請先填入生日'); $('birth').focus(); return; }
    busy = true;
    var go = $('go');
    go.disabled = true; go.classList.remove('pending'); go.innerHTML = '<span class="spin"></span>分析中';
    $('changedHint').classList.remove('show');
    var out = $('out');
    out.innerHTML = '<div class="loading"><div class="orbs">' + CHAKRA_COLORS.map(function (c, i) {
      return '<i style="--c:' + c + ';--a:' + (i * 360 / 7) + 'deg;--d:' + (i * 0.18) + 's"></i>';
    }).join('') + '</div><div class="step">' + STEPS[0] + '</div><div class="sub">一個生日・六種系統</div></div>';
    var top = out.getBoundingClientRect().top + window.scrollY - 10;
    window.scrollTo({ top: top, behavior: reduce ? 'auto' : 'smooth' });
    var i = 0, stepEl = out.querySelector('.step');
    var timer = setInterval(function () { i++; if (i < STEPS.length) stepEl.textContent = STEPS[i]; }, 230);
    setTimeout(function () {
      clearInterval(timer);
      run();
      revealAll();
      window.scrollTo({ top: out.getBoundingClientRect().top + window.scrollY - 10, behavior: 'auto' });
      go.disabled = false; go.textContent = '重新分析'; busy = false;
      toast('分析完成');
    }, reduce ? 50 : 1700);
  }
  function markChanged() {
    var go = $('go');
    if (busy) return;
    go.classList.add('pending'); go.textContent = '更新分析';
    $('changedHint').classList.add('show');
  }
  // 浮動按鈕：看完總覽後出現，捲到懶人包時隱藏
  var fab = document.createElement('a');
  fab.className = 'fab no-print'; fab.href = '#aipack'; fab.textContent = '✦ AI 深入分析';
  document.body.appendChild(fab);
  window.addEventListener('scroll', function () {
    var sum = $('summary'), pack = $('aipack');
    if (!pack) { fab.classList.remove('show'); return; }
    var start = sum ? sum.getBoundingClientRect().bottom : $('out').getBoundingClientRect().top + 600;
    var packTop = pack.getBoundingClientRect().top;
    fab.classList.toggle('show', start < 0 && packTop > window.innerHeight);
  }, { passive: true });
  $('go').addEventListener('click', analyze);
  $('print').addEventListener('click', function () { window.print(); });
  window.addEventListener('beforeprint', function () { document.querySelectorAll('details.fold').forEach(function (d) { d.open = true; }); });
  ['birth', 'time', 'place', 'gender', 'unknown', 'dst', 'trueSolar', 'name'].forEach(function (id) { $(id).addEventListener('change', markChanged); $(id).addEventListener('input', markChanged); });
  buildPicker();
  if ($('birth').value) { run(); revealAll(); $('go').textContent = '重新分析'; }
})();
